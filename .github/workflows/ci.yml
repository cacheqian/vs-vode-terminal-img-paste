name: Check and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - run: xvfb-run -a npm run test:host -- --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-terminal-image-paste-linux-x64
          path: artifacts/*.vsix
          if-no-files-found: error
